version: 2
updates:
  # GitHub Actions versions — keep the workflow modern.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Python deps via uv — group everything to keep PR noise low.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
