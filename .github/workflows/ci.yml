name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue tidy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.6"
  PYTHON_VERSION: "3.11"

jobs:
  # -------------------------------------------------------------------------
  # Lint — fast, no heavy deps.
  # -------------------------------------------------------------------------
  lint:
    name: lint (black + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # We don't commit uv.lock yet (it's regenerated on `uv sync`).
          # Cache by manifests instead so the cache key still varies with deps.
          cache-dependency-glob: |
            pyproject.toml
            **/pyproject.toml
          ignore-nothing-to-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools only
        # Saves ~3 GB / 5 minutes vs. a full workspace sync — black/ruff don't
        # need torch / lightgbm / pyod installed.
        run: |
          uv pip install --system --upgrade \
            "black==24.10.0" \
            "ruff==0.7.4"
      - name: black --check
        run: black --check .
      - name: ruff check
        run: ruff check .

  # -------------------------------------------------------------------------
  # Test — installs the full workspace (heavy deps) and runs pytest.
  # -------------------------------------------------------------------------
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # We don't commit uv.lock yet (it's regenerated on `uv sync`).
          # Cache by manifests instead so the cache key still varies with deps.
          cache-dependency-glob: |
            pyproject.toml
            **/pyproject.toml
          ignore-nothing-to-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: uv sync (workspace + dev)
        run: uv sync --all-packages --dev
      - name: pytest libs/ services/
        run: |
          uv run pytest \
            libs/ingest libs/storage libs/forecasting libs/anomaly libs/rag \
            services/inference \
            --cov=libs --cov=services \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Compose smoke (best-effort) — builds images, brings up the core stack,
  # and asserts every service reaches healthy/running. Skipped on PRs from
  # forks because GHA secrets aren't available there (we don't need any
  # right now, but this keeps room for future infra-mounted creds).
  # -------------------------------------------------------------------------
  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                       /usr/local/share/boost /opt/hostedtoolcache
      - name: Build images
        run: docker compose --profile core build
      - name: Bring up the stack
        run: |
          cp .env.example .env
          docker compose --profile core up -d
      - name: Wait for healthy
        # A service is OK when:
        #   * it has a healthcheck and it reports "healthy", OR
        #   * it has no healthcheck (`Health == ""`) and `State == "running"`.
        # Services with healthchecks: redpanda, timescaledb, inference.
        # Services without: ingest, storage-consumer, anomaly-detector, grafana
        #   (those check container State only).
        # The migrator runs to completion and exits 0 — it's healthy iff it's
        # exited successfully.
        run: |
          for i in $(seq 1 60); do
            not_ok=$(docker compose --profile core ps --all --format json \
              | jq -r '
                  select(.Service != "migrator") as $s
                  | select(
                      ($s.Health == "starting") or
                      ($s.Health == "unhealthy") or
                      ($s.Health == "" and $s.State != "running")
                    )
                  | .Service' \
              | grep -v "^$" || true)
            migrator_state=$(docker inspect noether-migrator --format='{{.State.Status}} {{.State.ExitCode}}' 2>/dev/null || echo "missing")
            if [ -z "$not_ok" ] && [ "$migrator_state" = "exited 0" ]; then
              echo "all services healthy / running; migrator exited 0"
              docker compose --profile core ps
              exit 0
            fi
            echo "waiting on: ${not_ok:-<none>}; migrator=$migrator_state"
            sleep 5
          done
          echo "timed out"
          docker compose --profile core ps
          docker compose --profile core logs --tail=200
          exit 1
      - name: Show resulting state
        if: always()
        run: |
          docker compose --profile core ps
          docker compose --profile core logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose --profile core down -v
