name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue tidy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.6"
  PYTHON_VERSION: "3.11"

jobs:
  # -------------------------------------------------------------------------
  # Lint — fast, no heavy deps.
  # -------------------------------------------------------------------------
  lint:
    name: lint (black + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools only
        # Saves ~3 GB / 5 minutes vs. a full workspace sync — black/ruff don't
        # need torch / lightgbm / pyod installed.
        run: |
          uv pip install --system --upgrade \
            "black==24.10.0" \
            "ruff==0.7.4"
      - name: black --check
        run: black --check .
      - name: ruff check
        run: ruff check .

  # -------------------------------------------------------------------------
  # Test — installs the full workspace (heavy deps) and runs pytest.
  # -------------------------------------------------------------------------
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: uv sync (workspace + dev)
        run: uv sync --all-packages --dev
      - name: pytest libs/ services/
        run: |
          uv run pytest \
            libs/ingest libs/storage libs/forecasting libs/anomaly \
            services/inference \
            --cov=libs --cov=services \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Compose smoke (best-effort) — builds images, brings up the core stack,
  # and asserts every service reaches healthy/running. Skipped on PRs from
  # forks because GHA secrets aren't available there (we don't need any
  # right now, but this keeps room for future infra-mounted creds).
  # -------------------------------------------------------------------------
  compose-smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                       /usr/local/share/boost /opt/hostedtoolcache
      - name: Build images
        run: docker compose --profile core build
      - name: Bring up the stack
        run: |
          cp .env.example .env
          docker compose --profile core up -d
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose --profile core ps --format json \
              | jq -r 'select(.Service != "migrator") | select(.Health == "starting" or .Health == "unhealthy" or .Health == "")| .Service' \
              | grep -v "^$" || true)
            if [ -z "$unhealthy" ]; then
              echo "all services healthy"
              exit 0
            fi
            echo "waiting on: $unhealthy"
            sleep 5
          done
          echo "timed out"
          docker compose --profile core ps
          docker compose --profile core logs --tail=200
          exit 1
      - name: Show resulting state
        if: always()
        run: |
          docker compose --profile core ps
          docker compose --profile core logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose --profile core down -v
