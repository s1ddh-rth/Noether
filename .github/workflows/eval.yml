name: Eval

# Path-filtered eval harnesses (run only when the relevant lib changes)
# plus a nightly full run that refreshes docs/benchmarks.md via PR.
on:
  pull_request:
    branches: [main]
  schedule:
    # 03:17 UTC daily — off the hour to dodge GitHub's cron congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.21"
  PYTHON_VERSION: "3.11"

jobs:
  # Which areas changed? (PR only — schedule/dispatch force-run all.)
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      forecast: ${{ steps.f.outputs.forecast }}
      anomaly: ${{ steps.f.outputs.anomaly }}
      rag: ${{ steps.f.outputs.rag }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            forecast:
              - 'libs/forecasting/**'
              - 'services/inference/**'
              - 'eval/forecast_harness.py'
            anomaly:
              - 'libs/anomaly/**'
              - 'services/anomaly-detector/**'
              - 'eval/anomaly_harness.py'
            rag:
              - 'libs/rag/**'
              - 'eval/rag_ragas.py'

  forecast:
    name: forecast harness
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.forecast == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            **/pyproject.toml
          ignore-nothing-to-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --dev
      - name: Run forecast harness
        # PRs: fast smoke (skip the slow PatchTST/ensemble CPU path).
        # Nightly/dispatch: full four-model benchmark.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python -m eval.forecast_harness --hours 48 --skip patchtst
          else
            uv run python -m eval.forecast_harness --hours 168
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: forecast-results
          path: eval/results/forecast.json
          if-no-files-found: warn

  anomaly:
    name: anomaly harness
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.anomaly == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            **/pyproject.toml
          ignore-nothing-to-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --dev
      - name: Run anomaly harness
        run: uv run python -m eval.anomaly_harness
      - uses: actions/upload-artifact@v7
        with:
          name: anomaly-results
          path: eval/results/anomaly.json
          if-no-files-found: warn

  # Nightly only: refresh docs/benchmarks.md and open a PR if it moved.
  benchmarks:
    name: render benchmarks → PR
    runs-on: ubuntu-latest
    needs: [forecast, anomaly]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: forecast-results
          path: eval/results
        continue-on-error: true
      - uses: actions/download-artifact@v7
        with:
          name: anomaly-results
          path: eval/results
        continue-on-error: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Render benchmarks
        run: python -m eval.render_benchmarks
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs(benchmarks): nightly eval refresh"
          title: "docs(benchmarks): nightly eval refresh"
          body: |
            Automated nightly refresh of `docs/benchmarks.md` from the
            forecast + anomaly harnesses. Review the numbers before merge.
          branch: bot/nightly-benchmarks
          delete-branch: true
          add-paths: docs/benchmarks.md
