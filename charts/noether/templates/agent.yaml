{{- if .Values.services.agent.enabled }}
{{- $component := "agent" }}
{{- $fullname := include "noether.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-agent
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.agent.port }}
      targetPort: http
  selector:
    {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "noether.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.services.agent.replicas }}
  selector:
    matchLabels:
      {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "noether.scheduling" . | nindent 6 }}
      initContainers:
        {{- include "noether.waitFor" (dict "ctx" . "deps" (list "timescaledb:5432" "neo4j:7687" "inference:8000")) | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "noether.appImage" (dict "ctx" . "svc" "agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.agent.port }}
          env:
            {{- include "noether.commonEnv" . | nindent 12 }}
            {{- include "noether.dbEnv" . | nindent 12 }}
            - name: AGENT_HOST
              value: "0.0.0.0"
            - name: AGENT_PORT
              value: {{ .Values.services.agent.port | quote }}
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "noether.secretName" . }}
                  key: agent-api-key
            - name: LLM_BACKEND
              value: {{ .Values.services.agent.llmBackend | quote }}
            - name: OLLAMA_HOST
              value: http://{{ $fullname }}-ollama:11434
            - name: OLLAMA_MODEL
              value: {{ .Values.services.agent.ollamaModel | quote }}
            - name: QDRANT_URL
              value: http://{{ $fullname }}-qdrant:6333
            - name: NEO4J_URI
              value: bolt://{{ $fullname }}-neo4j:7687
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "noether.secretName" . }}
                  key: neo4j-password
            - name: INFERENCE_URL
              value: http://{{ $fullname }}-inference:{{ .Values.services.inference.port }}
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "noether.secretName" . }}
                  key: inference-api-key
            {{- if .Values.mlflow.enabled }}
            - name: MLFLOW_TRACKING_URI
              value: http://{{ $fullname }}-mlflow:{{ .Values.mlflow.port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- include "noether.resources" (dict "ctx" . "res" .Values.services.agent.resources) | nindent 12 }}
{{- end }}
