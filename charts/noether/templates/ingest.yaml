{{- if .Values.services.ingest.enabled }}
{{- $component := "ingest" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "noether.fullname" . }}-ingest
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.services.ingest.metricsPort }}
      targetPort: metrics
  selector:
    {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "noether.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.services.ingest.replicas }}
  selector:
    matchLabels:
      {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "noether.scheduling" . | nindent 6 }}
      initContainers:
        {{- include "noether.waitFor" (dict "ctx" . "deps" (list "redpanda:9092")) | nindent 8 }}
      containers:
        - name: ingest
          image: {{ include "noether.appImage" (dict "ctx" . "svc" "ingest") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.services.ingest.metricsPort }}
          env:
            {{- include "noether.commonEnv" . | nindent 12 }}
            {{- include "noether.kafkaEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: {{ .Values.services.ingest.metricsPort | quote }}
            {{- range $k, $v := .Values.services.ingest.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- include "noether.resources" (dict "ctx" . "res" .Values.services.ingest.resources) | nindent 12 }}
{{- end }}
