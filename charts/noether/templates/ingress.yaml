{{- if .Values.ingress.enabled }}
{{- if not .Values.services.frontend.enabled }}
{{- fail "ingress.enabled=true requires services.frontend.enabled=true (the Ingress only fronts the frontend; everything else is ClusterIP by design)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "noether.componentName" (dict "ctx" . "component" "frontend") }}
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "noether.fullname" . }}-frontend
                port:
                  number: {{ .Values.services.frontend.port }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "noether.componentName" (dict "ctx" . "component" "frontend-tls") }}
  {{- end }}
{{- end }}
