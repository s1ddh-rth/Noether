{{- if .Values.infra.neo4j.enabled }}
{{- $component := "neo4j" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "noether.fullname" . }}-neo4j
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
  selector:
    {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "noether.componentName" (dict "ctx" . "component" $component) }}
  labels:
    {{- include "noether.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "noether.fullname" . }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "noether.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- include "noether.scheduling" . | nindent 6 }}
      containers:
        - name: neo4j
          image: {{ include "noether.image" (dict "ctx" . "ref" .Values.images.neo4j) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "noether.secretName" . }}
                  key: neo4j-auth
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            # Keep heap/pagecache modest — Graphiti index sizes are small.
            - name: NEO4J_server_memory_heap_initial__size
              value: 256m
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- include "noether.resources" (dict "ctx" . "res" .Values.infra.neo4j.resources) | nindent 12 }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.sizes.neo4j }}
  {{- end }}
{{- end }}
