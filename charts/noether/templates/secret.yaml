{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "noether.fullname" . }}-secrets
  labels:
    {{- include "noether.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  inference-api-key: {{ .Values.secrets.inferenceApiKey | quote }}
  agent-api-key: {{ .Values.secrets.agentApiKey | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | quote }}
  grafana-admin-password: {{ .Values.secrets.grafanaAdminPassword | quote }}
  # Neo4j consumes a single user/pass pair; render the combined form so the
  # StatefulSet can mount it as NEO4J_AUTH directly.
  neo4j-auth: {{ printf "neo4j/%s" .Values.secrets.neo4jPassword | quote }}
{{- end }}
