# =============================================================================
# Noether — local dev stack (SPEC section 8 Milestone 1)
#
# Usage:
#     cp .env.example .env
#     docker compose --profile core up -d
#
# Profiles:
#     core   — ingest + storage + inference + dependencies (default for M1)
#     eval   — adds one-shot job containers that run the forecast / anomaly harness
#     rag    — adds Qdrant for the libs/rag pipeline (M3)
#     agent  — adds Neo4j + Ollama + Qdrant + the agent service (M3 demo end-to-end)
#
# Quick start for the agent stack:
#     cp .env.example .env                                     # required
#     docker compose --profile agent up -d
#     docker exec -it noether-ollama ollama pull llama3.2:3b   # one-time
#     curl -X POST http://localhost:8100/chat \
#       -H "X-API-Key: $AGENT_API_KEY" \
#       -H "Content-Type: application/json" \
#       -d '{"session_id":"demo","question":"What is FT-101 right now?"}'
# =============================================================================
name: noether

x-common-env: &common-env
  OFFLINE_MODE: ${OFFLINE_MODE:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ------------------------------------------------------------------ Kafka
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: noether-redpanda
    profiles: [core, eval, agent]
    command:
      - redpanda
      - start
      - --node-id=0
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [noether]

  # -------------------------------------------------------------- TimescaleDB
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: noether-timescaledb
    profiles: [core, eval, agent]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      # Creates the MLflow backend-store database on first cluster init.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noether} -d ${POSTGRES_DB:-noether}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [noether]

  # ------------------------------------- one-shot: alembic upgrade head
  migrator:
    build:
      context: .
      dockerfile: services/storage-consumer/Dockerfile
    container_name: noether-migrator
    profiles: [core, eval, agent]
    environment:
      <<: *common-env
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["python", "-m", "noether_storage.migrations.run"]
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    networks: [noether]

  # ----------------------------------------------------------- ingest service
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: noether-ingest
    profiles: [core, eval, agent]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC_PLANT_TAGS: ${KAFKA_TOPIC_PLANT_TAGS:-plant.tags}
      REPLAY_HZ: ${REPLAY_HZ:-1.0}
      SIM_SEED: ${SIM_SEED:-42}
      FAULT_PROFILE: ${FAULT_PROFILE:-none}
      FAULT_START_S: ${FAULT_START_S:-0}
      METRICS_PORT: ${INGEST_METRICS_PORT:-9101}
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [noether]

  # ------------------------------------------------- Kafka -> Timescale loader
  storage-consumer:
    build:
      context: .
      dockerfile: services/storage-consumer/Dockerfile
    container_name: noether-storage-consumer
    profiles: [core, eval, agent]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC_PLANT_TAGS: ${KAFKA_TOPIC_PLANT_TAGS:-plant.tags}
      KAFKA_GROUP_ID: noether-storage-consumer
      METRICS_PORT: ${STORAGE_METRICS_PORT:-9102}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      redpanda:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks: [noether]

  # --------------------------------------------------- inference (FastAPI)
  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    container_name: noether-inference
    profiles: [core, eval, agent]
    environment:
      <<: *common-env
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: 8000
      MODEL_DIR: /app/models
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    volumes:
      - anomaly-models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [noether]

  # ----------------------------------------------- streaming AD worker
  anomaly-detector:
    build:
      context: .
      dockerfile: services/anomaly-detector/Dockerfile
    container_name: noether-anomaly-detector
    profiles: [core, eval, agent]
    environment:
      <<: *common-env
      ANOMALY_WINDOW_S: ${ANOMALY_WINDOW_S:-60}
      ANOMALY_STRIDE_S: ${ANOMALY_STRIDE_S:-5}
      ANOMALY_WARMUP_MIN: ${ANOMALY_WARMUP_MIN:-5}
      ANOMALY_BASELINE_MIN: ${ANOMALY_BASELINE_MIN:-30}
      ANOMALY_TAGS: ${ANOMALY_TAGS:-XMEAS_1,XMEAS_2,XMEAS_3,XMEAS_4,XMEAS_5,XMEAS_6,XMEAS_7,XMEAS_8,XMV_1,XMV_2}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-0.95}
      METRICS_PORT: ${ANOMALY_METRICS_PORT:-9103}
      MODEL_DIR: /app/models
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      ingest:
        condition: service_started
    volumes:
      - anomaly-models:/app/models
    networks: [noether]

  # ------------------------------------------------------------------- Qdrant
  # Vector store for the RAG pipeline (libs/rag). Profile-gated so the M1/M2
  # `core` smoke test isn't expanded; the agent service in M3 will move it
  # to the `core` profile when /chat depends on retrieval at startup.
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: noether-qdrant
    profiles: [rag, eval, agent]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # No healthcheck: Qdrant's official image is distroless-ish (no curl,
    # wget, python, or bash). The agent service health-checks Qdrant via
    # the SDK during its own startup probe instead.
    networks: [noether]

  # --------------------------------------------------------------------- Neo4j
  # Graphiti's backing store. Community Edition (Apache 2.0) — single-instance,
  # which is fine for a single-tenant v0.1 deployment.
  neo4j:
    image: neo4j:5.26-community
    container_name: noether-neo4j
    profiles: [agent]
    environment:
      # NEO4J_USER / NEO4J_PASSWORD are also injected as plain env vars so the
      # healthcheck shell can read them — Neo4j itself only consumes NEO4J_AUTH.
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'
      # Keep memory small for laptop dev; Graphiti's index sizes are modest.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER} -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [noether]

  # ------------------------------------------------------------------- Ollama
  # Default LLM backend in air-gapped mode. Models must be pulled once after
  # first start: `docker exec -it noether-ollama ollama pull llama3.2:3b`.
  # The image stays small (~300 MB) — pulling models is a runtime concern.
  ollama:
    image: ollama/ollama:0.5.4
    container_name: noether-ollama
    profiles: [agent]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [noether]

  # --------------------------------------------- agent service (LangGraph + /chat)
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: noether-agent
    profiles: [agent]
    environment:
      <<: *common-env
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8100
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      INFERENCE_URL: http://inference:8000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-noether}
      POSTGRES_USER: ${POSTGRES_USER:-noether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "8100:8100"
    depends_on:
      migrator:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      inference:
        condition: service_healthy
    # Reach a host-side Ollama (Fedora systemd, etc.) via
    #   OLLAMA_HOST=http://host.docker.internal:11434
    # The host-gateway alias works on Docker Desktop (Mac/Win) AND on
    # plain Linux Docker — declaring extra_hosts injects the
    # `--add-host=host.docker.internal:host-gateway` flag the daemon
    # needs. Falls through harmlessly if the user keeps the dockerized
    # ollama default (OLLAMA_HOST=http://ollama:11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [noether]

  # --------------------------------------------------------------- Prometheus
  # Scrapes /metrics off every Noether service. One scrape config covers all
  # profiles; targets not in the active profile just read as `down`.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: noether-prometheus
    profiles: [core, eval, agent]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # No healthcheck: the prom/prometheus image is distroless (no shell,
    # wget, or curl). Grafana surfaces scrape health instead.
    networks: [noether]

  # ------------------------------------------------------------------- MLflow
  # Experiment / model tracking. Backend store = a dedicated `mlflow`
  # database on the shared Timescale Postgres (created by initdb);
  # artefacts on a named volume. Not in `core` so the core smoke build
  # stays lean — it ships with the full `agent` demo and `eval` runs.
  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    container_name: noether-mlflow
    profiles: [agent, eval]
    command:
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER:-noether}:${POSTGRES_PASSWORD:-}@timescaledb:5432/mlflow
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    environment:
      <<: *common-env
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      timescaledb:
        condition: service_healthy
    networks: [noether]

  # ------------------------------------------------------------------ Grafana
  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: noether-grafana
    profiles: [core, eval, agent]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [noether]

  # ---------------------------- one-shot anomaly eval (profile: eval)
  anomaly-eval:
    build:
      context: .
      dockerfile: services/anomaly-detector/Dockerfile
    container_name: noether-anomaly-eval
    profiles: [eval]
    environment:
      <<: *common-env
    entrypoint: ["python", "-m", "eval.anomaly_harness"]
    volumes:
      - ./eval/results:/app/eval/results
    networks: [noether]

  # ---------------------------- one-shot forecast eval (profile: eval)
  forecast-eval:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    container_name: noether-forecast-eval
    profiles: [eval]
    environment:
      <<: *common-env
      MODEL_DIR: /app/models
    # --hours 48 keeps the smoke run feasible on small dev hosts.
    # --skip patchtst skips PatchTST + ensemble for the default smoke run
    # because torch CPU training is the slow / RAM-hungry path. Use:
    #   docker compose --profile eval run --rm forecast-eval python -m \
    #     eval.forecast_harness --hours 168
    # for the full four-model benchmark.
    entrypoint:
      - python
      - -m
      - eval.forecast_harness
      - --hours
      - "48"
      - --skip
      - patchtst
    volumes:
      - ./eval/results:/app/eval/results
    networks: [noether]

volumes:
  redpanda-data:
  timescaledb-data:
  grafana-data:
  prometheus-data:
  mlflow-artifacts:
  anomaly-models:
  qdrant-data:
  neo4j-data:
  ollama-data:

networks:
  noether:
    driver: bridge
