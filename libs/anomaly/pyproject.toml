[project]
name = "noether-anomaly"
version = "0.0.0"
description = "Multivariate anomaly detection: PyOD ensemble + EWMA + SHAP."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-storage",
    "pyod>=2.0,<3",
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
    "scipy>=1.13,<2",
    "shap>=0.46,<0.50",
    "joblib>=1.4,<2",
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_anomaly"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
