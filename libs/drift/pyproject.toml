[project]
name = "noether-drift"
version = "0.0.0"
description = "Evidently-based input/prediction drift monitoring against TimescaleDB."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-storage",
    "evidently>=0.4.40,<0.5",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.2",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.30,<0.31",
    "pyyaml>=6.0,<7",
    "structlog>=24.4,<25",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_drift"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
