[project]
name = "noether-forecasting"
version = "0.0.0"
description = "Forecasting models and feature engineering for plant tags."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-storage",
    "lightgbm>=4.5,<5",
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.6",
    "pyarrow>=18,<19",
    "joblib>=1.4,<2",
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_forecasting"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
