[project]
name = "noether-ingest"
version = "0.0.0"
description = "Schema and synthetic generators for plant tag streams."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "numpy>=1.26,<2.2",
    "structlog>=24.4,<25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_ingest"]
