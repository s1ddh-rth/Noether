[project]
name = "noether-memory"
version = "0.0.0"
description = "Cross-session memory: typed MemoryFact + pluggable backing store (Graphiti in v0.2)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_memory"]

[tool.hatch.build.targets.wheel.shared-data]
"noether_memory/py.typed" = "noether_memory/py.typed"
