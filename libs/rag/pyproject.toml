[project]
name = "noether-rag"
version = "0.0.0"
description = "Hybrid retrieval pipeline: PDF parsing, BGE embeddings, Qdrant + BM25 + RRF + cross-encoder reranking."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.2",
    "pydantic>=2.9,<3",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.3,<4",
    "rank-bm25>=0.2.2,<0.3",
    "pypdfium2>=4.30,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_rag"]
