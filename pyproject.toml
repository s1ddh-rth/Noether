[project]
name = "noether"
version = "0.0.0"
description = "Open-source reference architecture for industrial AI copilots."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Noether contributors" }]
dependencies = [
    "noether-ingest",
    "noether-storage",
    "noether-forecasting",
    "noether-anomaly",
    "noether-svc-ingest",
    "noether-svc-storage-consumer",
    "noether-svc-inference",
    "noether-svc-anomaly",
]

[dependency-groups]
dev = [
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
    "testcontainers[kafka,postgres]==4.14.2",
    "ipython==9.13.0",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
noether-forecasting = { workspace = true }
noether-anomaly = { workspace = true }
noether-svc-ingest = { workspace = true }
noether-svc-storage-consumer = { workspace = true }
noether-svc-inference = { workspace = true }
noether-svc-anomaly = { workspace = true }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by black
    "N803",   # ML convention — capitalized X_train, X_val, X are universal
    "N806",   # same — local capitalized variables in ML code
    "B008",   # FastAPI Depends(...) in default args is canonical
    "RUF002", # em-dashes in docstrings are intentional
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "aiokafka.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "eval"]
# importlib mode lets two test files share a basename across packages
# (e.g. libs/ingest/tests/test_schema.py and libs/storage/tests/test_schema.py)
# without colliding in sys.modules. Default "prepend" mode is rootdir-based
# and would conflict.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: requires docker compose stack",
    "slow: takes more than 1s",
]

[tool.coverage.run]
branch = true
source = ["libs", "services"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
# Ratchet upward as we add tests. Current (post-M2 + PatchTST + AD) covers
# the unit-testable surface; integration paths (Kafka loop, asyncpg COPY,
# AD streaming worker) need docker-backed tests we don't run in CI yet.
fail_under = 35
show_missing = true
skip_covered = false
