[project]
name = "noether-svc-agent"
version = "0.0.0"
description = "LangGraph-orchestrated agent service: /chat behind a router + sub-agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-memory",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "structlog>=24.4,<25",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
noether-agent = "noether_svc_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_svc_agent"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-memory = { workspace = true }
