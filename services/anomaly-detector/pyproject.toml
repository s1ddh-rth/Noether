[project]
name = "noether-svc-anomaly"
version = "0.0.0"
description = "Streaming anomaly detector: scores 60s windows from Timescale every 5s."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-storage",
    "noether-anomaly",
    "asyncpg>=0.30,<0.31",
    "structlog>=24.4,<25",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[project.scripts]
noether-anomaly-detector = "noether_svc_anomaly.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_svc_anomaly"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
noether-anomaly = { workspace = true }
