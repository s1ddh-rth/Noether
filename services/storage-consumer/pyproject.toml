[project]
name = "noether-svc-storage-consumer"
version = "0.0.0"
description = "Kafka → TimescaleDB consumer with batched COPY inserts."
requires-python = ">=3.11,<3.12"
dependencies = [
    "noether-ingest",
    "noether-storage",
    "aiokafka>=0.12,<0.13",
    "asyncpg>=0.30,<0.31",
    "structlog>=24.4,<25",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
noether-storage-consumer = "noether_svc_storage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noether_svc_storage"]

[tool.uv.sources]
noether-ingest = { workspace = true }
noether-storage = { workspace = true }
